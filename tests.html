<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Taller PDF</title>
  <link rel="stylesheet" href="css/styles.css?v=6">
  <style>
    table { border-collapse: collapse; width: 100%; background: var(--surface); }
    td, th { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; font-size: .9rem; }

    .fail { color: var(--err); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Pruebas automáticas</h1>
    <p id="summary" role="status">Ejecutando… (necesita conexión para cargar las librerías)</p>
    <table><thead><tr><th>Prueba</th><th>Resultado</th><th>Detalle</th><th>ms</th></tr></thead><tbody id="rows"></tbody></table>
  </main>
  <script src="js/converters.js?v=6"></script>
  <script src="js/tests.js?v=6"></script>
</body>
</html>
